name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verify:
    name: Backend Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Compile
        id: backend_compile
        continue-on-error: true
        run: |
          set -o pipefail
          mvn -B -ntp -DskipTests compile 2>&1 | tee backend-compile.log

      - name: Unit Tests
        id: backend_tests
        if: ${{ steps.backend_compile.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          mvn -B -ntp test -Dsurefire.printSummary=true -DtrimStackTrace=false 2>&1 | tee backend-unit-tests.log

      - name: Backend Stage Summary
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.backend_compile.outcome }}
          TESTS_OUTCOME: ${{ steps.backend_tests.outcome }}
        run: |
          {
            echo '## Backend verification'
            echo '| Stage | Outcome |'
            echo '| --- | --- |'
            printf '| Compile | %s |\n' "$COMPILE_OUTCOME"
            printf '| Unit tests | %s |\n' "$TESTS_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Debug Report Paths
        if: always()
        run: |
          echo "Searching report directories under workspace..."
          find . -type d \( -name surefire-reports -o -name failsafe-reports -o -name "*-reports" \) -print || true

      - name: Upload Backend Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports-${{ github.run_number }}
          path: |
            backend-compile.log
            backend-unit-tests.log
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/*-reports/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Assert Backend Verify Passed
        if: always()
        run: |
          compile="${{ steps.backend_compile.outcome }}"
          tests="${{ steps.backend_tests.outcome }}"

          if [[ "$compile" != "success" ]]; then
            echo "::error::Backend verify failed in Compile stage (outcome=$compile)"
            exit 1
          fi

          if [[ "$tests" != "success" ]]; then
            echo "::error::Backend verify failed in Unit Tests stage (outcome=$tests)"
            exit 1
          fi

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: fronted/vue3-merged
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: fronted/vue3-merged/pnpm-lock.yaml
          package-json-file: fronted/vue3-merged/package.json
          install: false

      - name: Install Dependencies
        id: frontend_install
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee frontend-install.log

      - name: Run Unit Tests
        id: frontend_tests
        run: |
          set -o pipefail
          pnpm test:unit --reporter=default --reporter=junit --outputFile.junit=test-results/unit.xml 2>&1 | tee frontend-unit-tests.log

      - name: Build Frontend
        id: frontend_build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee frontend-build.log

      - name: Frontend Stage Summary
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.frontend_install.outcome }}
          TESTS_OUTCOME: ${{ steps.frontend_tests.outcome }}
          BUILD_OUTCOME: ${{ steps.frontend_build.outcome }}
        run: |
          {
            echo '## Frontend verification'
            echo '| Stage | Outcome |'
            echo '| --- | --- |'
            printf '| Install dependencies | %s |\n' "$INSTALL_OUTCOME"
            printf '| Unit tests | %s |\n' "$TESTS_OUTCOME"
            printf '| Production build | %s |\n' "$BUILD_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Frontend Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-reports-${{ github.run_number }}
          path: |
            fronted/vue3-merged/frontend-*.log
            fronted/vue3-merged/test-results/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Frontend Dist
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.run_number }}
          path: fronted/vue3-merged/dist/**
          retention-days: 3
